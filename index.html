<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ڕۆتینەکانی ژیان - بەرەو خەونەکان</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Inter','Segoe UI',Tahoma,sans-serif;
    background:#0f0e13;
    background-image:
        radial-gradient(ellipse at 20% 50%,rgba(72,49,212,.15),transparent 60%),
        radial-gradient(ellipse at 80% 20%,rgba(120,80,220,.10),transparent 50%),
        radial-gradient(ellipse at 50% 100%,rgba(40,20,120,.20),transparent 50%);

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.container{
    max-width:580px;
    width:100%;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-radius:40px;

    padding:30px 24px 40px;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 40px 80px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.05);

    position:relative;
    overflow:hidden;
}

.container::before{
    content:'';

    position:absolute;

    top:-50%;
    left:-50%;

    width:200%;
    height:200%;

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(120,80,255,.03),
            transparent 60%
        );

    pointer-events:none;
}

.glow-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    pointer-events:none;
}

.glow-orb-1{
    width:200px;
    height:200px;

    top:-60px;
    right:-60px;

    background:rgba(120,80,255,.15);
}

.glow-orb-2{
    width:150px;
    height:150px;

    bottom:-40px;
    left:-40px;

    background:rgba(255,100,150,.10);
}

h1{
    font-size:30px;
    text-align:center;

    color:#fff;

    font-weight:700;

    margin-bottom:6px;

    position:relative;
    z-index:1;
}

.highlight{
    background:linear-gradient(135deg,#a78bfa,#818cf8);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subhead{
    text-align:center;

    color:rgba(255,255,255,.4);

    font-size:13px;

    margin-bottom:25px;

    border-bottom:1px solid rgba(255,255,255,.05);

    padding-bottom:14px;

    position:relative;
    z-index:1;
}

/* Progress */

.progress-wrap{
    background:rgba(255,255,255,.05);

    border-radius:40px;

    height:6px;

    margin:20px 0 8px;

    overflow:hidden;

    position:relative;
    z-index:1;
}

.progress-fill{
    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            #a78bfa,
            #818cf8,
            #6366f1
        );

    border-radius:40px;

    transition:width .6s ease;

    box-shadow:
        0 0 20px rgba(120,80,255,.3);
}

.progress-label{
    display:flex;

    justify-content:space-between;

    font-size:11px;

    color:rgba(255,255,255,.3);

    position:relative;
    z-index:1;
}

/* Task */

.task-area{
    margin-top:30px;
}

.task-card{
    background:rgba(255,255,255,.04);

    backdrop-filter:blur(10px);

    border-radius:28px;

    padding:30px 22px;

    border:1px solid rgba(255,255,255,.06);

    text-align:center;

    position:relative;
    z-index:1;

    animation:fadeInUp .5s ease;
}

.task-number{
    font-size:12px;

    color:rgba(255,255,255,.3);

    margin-bottom:20px;
}

.task-emoji{
    font-size:55px;

    margin-bottom:15px;
}

.task-text{
    font-size:22px;

    font-weight:600;

    color:rgba(255,255,255,.9);

    margin-bottom:25px;

    line-height:1.7;
}

.task-group{
    display:inline-block;

    background:rgba(120,80,255,.12);

    color:#a78bfa;

    padding:5px 15px;

    border-radius:30px;

    font-size:12px;

    margin-bottom:25px;
}

.complete-btn{
    border:none;

    width:100%;

    padding:16px;

    border-radius:40px;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    font-family:inherit;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #6366f1
        );

    box-shadow:
        0 10px 30px rgba(99,102,241,.25);

    transition:.3s;
}

.complete-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 15px 40px rgba(99,102,241,.4);
}

.complete-btn:active{
    transform:scale(.98);
}

/* Empty */

.finished{
    text-align:center;

    padding:35px 20px;

    animation:fadeInUp .6s ease;
}

.finished-icon{
    font-size:65px;

    margin-bottom:15px;
}

.finished-title{
    font-size:25px;

    color:#fff;

    font-weight:700;

    margin-bottom:10px;
}

.finished-text{
    color:rgba(255,255,255,.4);

    font-size:14px;

    line-height:1.8;
}

/* Dhikr */

.toast{
    position:fixed;

    bottom:30px;
    left:50%;

    transform:
        translateX(-50%)
        translateY(30px);

    background:rgba(20,18,30,.96);

    backdrop-filter:blur(30px);

    color:#fff;

    padding:20px 30px;

    border-radius:25px;

    z-index:999;

    opacity:0;

    pointer-events:none;

    transition:.5s;

    text-align:center;

    max-width:90%;

    border:1px solid rgba(255,255,255,.06);
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

.dhikr-text{
    font-size:25px;

    font-weight:700;

    color:#fbbf24;

    margin-bottom:5px;

    font-family:
        'Segoe UI',
        Tahoma,
        sans-serif;
}

.dhikr-ku{
    font-size:12px;

    color:rgba(255,255,255,.35);
}

/* Report */

.report-card{
    margin-top:25px;

    padding:25px;

    border-radius:25px;

    text-align:center;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.06);

    animation:fadeInUp .5s ease;
}

.report-icon{
    font-size:45px;

    margin-bottom:10px;
}

.report-title{
    color:#fff;

    font-size:22px;

    font-weight:700;
}

.report-percent{
    font-size:45px;

    font-weight:700;

    color:#a78bfa;

    margin:15px 0;
}

.report-text{
    color:rgba(255,255,255,.4);

    font-size:13px;

    line-height:2;
}

.reset-btn{
    width:100%;

    margin-top:20px;

    padding:14px;

    border:none;

    border-radius:40px;

    background:rgba(255,255,255,.06);

    color:#fff;

    font-family:inherit;

    cursor:pointer;

    font-size:15px;
}

.footer{
    margin-top:35px;

    text-align:center;

    border-top:1px solid rgba(255,255,255,.05);

    padding-top:22px;

    position:relative;
    z-index:1;
}

.dream-text{
    font-size:19px;

    font-weight:700;

    color:#a78bfa;

    margin-bottom:10px;
}

.reminder{
    font-size:14px;

    color:rgba(255,255,255,.4);

    margin-bottom:5px;
}

.strong{
    font-size:16px;

    color:rgba(255,255,255,.6);

    font-weight:600;
}

.sleep-text{
    font-size:13px;

    color:rgba(255,255,255,.25);

    margin-top:7px;
}

.credit{
    font-size:10px;

    color:rgba(255,255,255,.12);

    margin-top:10px;
}

@keyframes fadeInUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@media(max-width:480px){

    .container{
        padding:22px 16px 30px;

        border-radius:28px;
    }

    h1{
        font-size:25px;
    }

    .task-card{
        padding:28px 18px;
    }

    .task-text{
        font-size:19px;
    }

    .task-emoji{
        font-size:48px;
    }

    .complete-btn{
        font-size:15px;
    }

}

</style>
</head>

===================================================== */

const DHIKR_LIST = [

    'الْحَمْدُ لِلَّهِ',

    'لَا إِلَٰهَ إِلَّا اللَّهُ',

    'اللَّهُ أَكْبَرُ',

    'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',

    'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',

    'أَسْتَغْفِرُ اللَّهَ',

    'لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ'

];


let lastDhikr = -1;


function showDhikr(){

    let index;

    do{

        index =
            Math.floor(
                Math.random() *
                DHIKR_LIST.length
            );

    }
    while(
        index === lastDhikr &&
        DHIKR_LIST.length > 1
    );

    lastDhikr = index;


    document.getElementById(
        'dhikrText'
    ).textContent =
        DHIKR_LIST[index];


    const toast =
        document.getElementById(
            'dhikrToast'
        );


    toast.classList.add('show');


    clearTimeout(
        toast._timer
    );


    toast._timer =
        setTimeout(
            function(){

                toast.classList.remove(
                    'show'
                );

            },
            3000
        );

}

/* =====================================================
   Storage
===================================================== */

const STORAGE_KEY =
    'dayflow_completed_v2';


let completed =
    new Set();


function loadState(){

    try{

        const data =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(data){

            const arr =
                JSON.parse(data);

            if(Array.isArray(arr)){

                completed =
                    new Set(arr);

            }

        }

    }
    catch(error){

        completed =
            new Set();

    }

}


function saveState(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(
            [...completed]
        )

    );

}


/* =====================================================
   یەکەم ئەرکی نەکراو
===================================================== */

function getCurrentTask(){

    return TASKS.find(
        task =>
            !completed.has(task.id)
    );

}


/* =====================================================
   پڕۆگرێس
===================================================== */

function updateProgress(){

    const total =
        TASKS.length;

    const done =
        completed.size;

    const percent =
        Math.round(
            (done / total) * 100
        );


    document.getElementById(
        'progressFill'
    ).style.width =
        percent + '%';


    document.getElementById(
        'progressText'
    ).textContent =
        percent + '٪';

}


/* =====================================================
   نیشاندانی ئەرکی ئێستا
===================================================== */

function renderCurrentTask(){

    const area =
        document.getElementById(
            'taskArea'
        );

    const task =
        getCurrentTask();


    updateProgress();


    /* هەموو ئەرکەکان تەواو بوون */

    if(!task){

        area.innerHTML = `

            <div class="finished">

                <div class="finished-icon">
                    🎉
                </div>

                <div class="finished-title">
                    زۆر باش!
                </div>

                <div class="finished-text">
                    هەموو ئەرکەکانی ئەمڕۆت تەواو کردووە.
                    <br>
                    بەردەوام بە، بەرەو خەونەکانت!
                </div>

            </div>

        `;


        showReport();

        return;

    }


    document.getElementById(
        'reportArea'
    ).innerHTML = '';


    const index =
        TASKS.indexOf(task) + 1;


    area.innerHTML = `

        <div class="task-card">

            <div class="task-number">
                ئەرکی ${index} لە ${TASKS.length}
            </div>

            <div class="task-emoji">
                ${task.emoji}
            </div>

            <div class="task-group">
                ${task.group}
            </div>

            <div class="task-text">
                ${task.label}
            </div>

            <button
                class="complete-btn"
                id="completeBtn">

                ✅ ئەنجامم دا

            </button>

        </div>

    `;


    document.getElementById(
        'completeBtn'
    ).addEventListener(
        'click',
        completeCurrentTask
    );

}


/* =====================================================
   تەواوکردنی ئەرک
===================================================== */

function completeCurrentTask(){

    const task =
        getCurrentTask();


    if(!task) return;


    completed.add(
        task.id
    );


    saveState();


    showDhikr();


    /*
       کەمێک دواکەوتن
       بۆ ئەوەی زکرەکە دیار بێت
    */

    setTimeout(
        function(){

            renderCurrentTask();

        },
        500
    );

}


/* =====================================================
   ڕاپۆرت
===================================================== */

function showReport(){

    const total =
        TASKS.length;

    const done =
        completed.size;

    const percent =
        Math.round(
            (done / total) * 100
        );


    document.getElementById(
        'reportArea'
    ).innerHTML = `

        <div class="report-card">

            <div class="report-icon">
                📊
            </div>

            <div class="report-title">
                ڕاپۆرتی ڕۆژ
            </div>

            <div class="report-percent">
                ${percent}٪
            </div>

            <div class="report-text">

                هەموو ${done} ئەرکەکەت
                تەواو کردووە 🎉

                <br>

                سبەی ڕۆژێکی نوێیە؛
                بەهێزتر دەست پێ بکەوە 💪

            </div>

            <button
                class="reset-btn"
                id="resetBtn">

                🔄 دەستپێکردنەوەی ڕۆژ

            </button>

        </div>

    `;


    document.getElementById(
        'resetBtn'
    ).addEventListener(
        'click',
        resetDay
    );

}


/* =====================================================
   Reset
===================================================== */

function resetDay(){

    const answer =
        confirm(
            'دڵنیایت دەتەوێت ڕۆژەکە لە سەرەتا دەست پێ بکەیتەوە؟'
        );


    if(!answer) return;


    completed.clear();


    saveState();


    document.getElementById(
        'reportArea'
    ).innerHTML = '';


    renderCurrentTask();

}


/* =====================================================
   دەستپێکردن
===================================================== */

loadState();

renderCurrentTask();

})();

</script>
